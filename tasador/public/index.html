<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Tasador — Amado Libros</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f18;
      --surface: #161926;
      --surface2: #1e2235;
      --border: #262c42;
      --text: #e8eaf5;
      --muted: #6b7394;
      --accent: #5c6ef5;
      --h: 52px; /* header height */
      --compra-bg: #14532d;
      --compra-fg: #4ade80;
      --baja-bg: #451a03;
      --baja-fg: #fb923c;
      --paso-bg: #450a0a;
      --paso-fg: #f87171;
      --radius: 10px;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      height: var(--h);
      min-height: var(--h);
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
    header h1 em { color: var(--accent); font-style: normal; }
    header .hist-btn {
      font-size: 12px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      display: none;
    }
    header .hist-btn.visible { display: block; }

    /* ── MAIN LAYOUT ── */
    .layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ── FORM PANEL ── */
    .panel-form {
      width: 320px;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 14px;
      gap: 10px;
    }

    /* upload zone */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 12px;
      text-align: center;
      position: relative;
    }
    .upload-zone:hover, .upload-zone.drag { border-color: var(--accent); background: var(--surface2); }
    .upload-zone input { display: none; }

    .upload-ph { pointer-events: none; }
    .upload-ph strong { display: block; font-size: 14px; color: var(--text); margin-bottom: 3px; }
    .upload-ph small { font-size: 12px; color: var(--muted); }

    /* photo grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }
    .photo-thumb {
      position: relative;
      aspect-ratio: 1;
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface2);
    }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-thumb .del {
      position: absolute; top: 3px; right: 3px;
      width: 22px; height: 22px;
      background: rgba(0,0,0,.75); border: none; border-radius: 50%;
      color: #fff; font-size: 14px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .photo-thumb .del:hover { background: #dc2626; }
    .photo-meta {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; color: var(--muted); width: 100%;
      margin-top: 6px;
    }
    .photo-meta button {
      font-size: 12px; color: var(--accent);
      background: none; border: none; cursor: pointer; padding: 0;
    }

    /* fields */
    .field-label {
      font-size: 11px; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 4px;
    }
    textarea, input[type="number"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      padding: 9px 11px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    textarea { resize: none; height: 58px; line-height: 1.4; }
    textarea:focus, input[type="number"]:focus { border-color: var(--accent); }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }

    /* tasar button */
    .btn-tasar {
      width: 100%;
      padding: 0;
      height: 52px;
      background: var(--accent);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.2px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      flex-shrink: 0;
      margin-top: auto;
    }
    .btn-tasar:hover:not(:disabled) { opacity: 0.88; }
    .btn-tasar:active:not(:disabled) { transform: scale(0.98); }
    .btn-tasar:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-tasar.loading { background: var(--surface2); color: var(--muted); }

    /* error */
    .error-msg {
      background: rgba(220,38,38,.12);
      border: 1px solid rgba(220,38,38,.3);
      color: #f87171;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    /* ── RESULT PANEL ── */
    .panel-result {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .result-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
      gap: 6px;
      padding: 20px;
      text-align: center;
    }
    .result-empty .hint { font-size: 12px; opacity: 0.6; }

    /* decision block */
    .decision-block {
      padding: 20px 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      flex-shrink: 0;
    }
    .decision-block .book-title {
      font-size: 12px; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 4px;
    }
    .decision-badge {
      font-size: clamp(36px, 5vw, 56px);
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1;
      padding: 10px 20px;
      border-radius: 12px;
      display: inline-block;
    }
    .badge-compra { background: var(--compra-bg); color: var(--compra-fg); }
    .badge-baja   { background: var(--baja-bg);   color: var(--baja-fg); }
    .badge-paso   { background: var(--paso-bg);    color: var(--paso-fg); }

    /* numbers grid */
    .numbers-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 0 24px 14px;
      flex-shrink: 0;
    }
    .num-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .num-card .num-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .num-card .num-value { font-size: 20px; font-weight: 700; color: var(--text); line-height: 1.2; margin-top: 2px; }
    .num-card .num-value.highlight { color: var(--compra-fg); }

    /* por qué */
    .section {
      padding: 0 24px 12px;
      flex-shrink: 0;
    }
    .section-title {
      font-size: 11px; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 6px;
      padding-bottom: 5px; border-bottom: 1px solid var(--border);
    }
    .why-lines { display: flex; flex-direction: column; gap: 5px; }
    .why-line { font-size: 14px; color: var(--text); display: flex; gap: 8px; }
    .why-line .sign { font-weight: 700; flex-shrink: 0; }
    .sign-pos { color: var(--compra-fg); }
    .sign-neg { color: var(--paso-fg); }

    .ojo-tip-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 0 24px 14px;
      flex-shrink: 0;
    }
    .ojo-tip-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .ojo-tip-card .card-label {
      font-size: 11px; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.4px; margin-bottom: 4px;
    }
    .ojo-tip-card .card-text { font-size: 13px; color: var(--text); line-height: 1.4; }

    /* mlu section */
    .mlu-section { padding: 0 24px 14px; flex-shrink: 0; }
    .mlu-section .section-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
    .mlu-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--compra-fg); flex-shrink: 0; }
    .mlu-searches { display: flex; flex-direction: column; gap: 8px; }
    .mlu-search-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    .mlu-search-query { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .mlu-search-query strong { color: var(--text); }
    .mlu-stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .mlu-stat { font-size: 12px; }
    .mlu-stat .sl { color: var(--muted); }
    .mlu-stat .sv { color: var(--text); font-weight: 600; }
    .mlu-stat .sv.med { color: var(--compra-fg); }
    .mlu-items { display: flex; flex-direction: column; gap: 3px; }
    .mlu-item { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
    .mlu-item .mi-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .mlu-item .mi-price { color: var(--text); font-weight: 600; flex-shrink: 0; }
    .mlu-empty { font-size: 13px; color: var(--muted); font-style: italic; }
    .mlu-no-results { font-size: 12px; color: var(--paso-fg); }

    /* loading overlay on result */
    .loading-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .loading-steps { display: flex; flex-direction: column; gap: 8px; }
    .load-step {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.3s;
    }
    .load-step.active { color: var(--text); }
    .load-step.done { color: var(--compra-fg); }
    .load-step .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--border); flex-shrink: 0;
      transition: background 0.3s;
    }
    .load-step.active .dot { background: var(--accent); animation: pulse 1s infinite; }
    .load-step.done .dot { background: var(--compra-fg); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* historial drawer */
    .hist-drawer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      transform: translateX(100%);
      transition: transform 0.25s ease;
    }
    .hist-drawer.open { transform: none; }
    .hist-header {
      height: var(--h);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }
    .hist-header h2 { font-size: 15px; font-weight: 600; }
    .hist-close {
      font-size: 22px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 4px;
    }
    .hist-list-scroll { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .hist-entry {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.15s;
    }
    .hist-entry:hover { border-color: var(--accent); }
    .hist-badge-sm {
      font-size: 12px; font-weight: 800;
      padding: 3px 10px; border-radius: 6px;
      flex-shrink: 0;
    }
    .hb-compra { background: var(--compra-bg); color: var(--compra-fg); }
    .hb-baja   { background: var(--baja-bg);   color: var(--baja-fg); }
    .hb-paso   { background: var(--paso-bg);    color: var(--paso-fg); }
    .hist-entry-text { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* paste flash */
    .paste-flash {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: #fff;
      font-size: 13px; font-weight: 600;
      padding: 7px 18px; border-radius: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 200;
    }
    .paste-flash.show { opacity: 1; }

    /* ── MOBILE ── */
    @media (max-width: 680px) {
      html, body { overflow: auto; }
      .layout { flex-direction: column; height: auto; }
      .panel-form {
        width: 100%; min-width: 0;
        border-right: none; border-bottom: 1px solid var(--border);
        overflow-y: visible;
      }
      .panel-result { min-height: 0; overflow: visible; }
      .numbers-grid { grid-template-columns: repeat(3, 1fr); }
      .ojo-tip-grid { grid-template-columns: 1fr; }
      .decision-badge { font-size: 40px; }
      header .hist-btn.visible { display: block; }
    }

    @media (min-width: 681px) {
      .panel-result { overflow-y: auto; }
    }
  </style>
</head>
<body>

<header>
  <h1>Tasador <em>Amado</em></h1>
  <button class="hist-btn" id="histBtn">Historial</button>
</header>

<div class="layout">

  <!-- FORM -->
  <div class="panel-form">

    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="image/*" multiple />
      <div class="upload-ph" id="uploadPh">
        <strong>Fotos del libro</strong>
        <small>Toca, arrastra o pega (Ctrl+V)</small>
        <small style="margin-top:2px;opacity:.5">hasta 6 fotos</small>
      </div>
      <div class="photo-grid" id="photoGrid"></div>
      <div class="photo-meta" id="photoMeta" style="display:none">
        <span id="photoCount" style="color:var(--muted);font-size:12px">0 / 6</span>
        <button id="addMoreBtn" type="button">+ agregar</button>
      </div>
    </div>

    <div>
      <div class="field-label">Contexto</div>
      <textarea id="contexto" placeholder="Estado, lote, algo que viste..."></textarea>
    </div>

    <div class="row">
      <div>
        <div class="field-label">Costo UYU</div>
        <input type="number" id="costo" placeholder="0" min="0" inputmode="numeric" />
      </div>
      <div>
        <div class="field-label">PVP ref. UYU</div>
        <input type="number" id="pvp" placeholder="0" min="0" inputmode="numeric" />
      </div>
    </div>

    <div id="errorMsg" class="error-msg" style="display:none"></div>

    <button class="btn-tasar" id="btnTasar" disabled>Tasar</button>

  </div>

  <!-- RESULT -->
  <div class="panel-result" id="panelResult">

    <div class="result-empty" id="resultEmpty">
      <div>Foto + Tasar</div>
      <div class="hint">La decision aparece aca</div>
    </div>

    <div id="loadingState" class="loading-state" style="display:none">
      <div class="loading-steps">
        <div class="load-step" id="step1"><div class="dot"></div>Identificando libro...</div>
        <div class="load-step" id="step2"><div class="dot"></div>Buscando en Mercado Libre...</div>
        <div class="load-step" id="step3"><div class="dot"></div>Analizando...</div>
      </div>
    </div>

    <div id="resultContent" style="display:none">
      <div class="decision-block">
        <div class="book-title" id="resTitle"></div>
        <div class="decision-badge" id="resBadge"></div>
      </div>
      <div class="numbers-grid" id="resNumbers"></div>
      <div class="mlu-section" id="resMlu" style="display:none">
        <div class="section-title"><div class="mlu-dot"></div>Mercado real (MLU ahora)</div>
        <div class="mlu-searches" id="resMluSearches"></div>
      </div>
      <div class="section" id="resWhy" style="display:none">
        <div class="section-title">Por que</div>
        <div class="why-lines" id="resWhyLines"></div>
      </div>
      <div class="ojo-tip-grid" id="resOjoTip"></div>
    </div>

  </div>
</div>

<!-- HISTORIAL DRAWER -->
<div class="hist-drawer" id="histDrawer">
  <div class="hist-header">
    <h2>Historial</h2>
    <button class="hist-close" id="histClose">x</button>
  </div>
  <div class="hist-list-scroll" id="histListScroll"></div>
</div>

<div class="paste-flash" id="pasteFlash">Imagen pegada</div>

<script>
  const API_URL = '/api/tasar';
  const MAX = 6;

  let photos = [];
  let historial = [];

  const uploadZone  = document.getElementById('uploadZone');
  const fileInput   = document.getElementById('fileInput');
  const uploadPh    = document.getElementById('uploadPh');
  const photoGrid   = document.getElementById('photoGrid');
  const photoMeta   = document.getElementById('photoMeta');
  const photoCount  = document.getElementById('photoCount');
  const addMoreBtn  = document.getElementById('addMoreBtn');
  const btnTasar    = document.getElementById('btnTasar');
  const errorMsg    = document.getElementById('errorMsg');
  const resultEmpty = document.getElementById('resultEmpty');
  const loadingState= document.getElementById('loadingState');
  const resultContent=document.getElementById('resultContent');
  const histBtn     = document.getElementById('histBtn');
  const histDrawer  = document.getElementById('histDrawer');
  const histClose   = document.getElementById('histClose');
  const histListScroll=document.getElementById('histListScroll');
  const pasteFlash  = document.getElementById('pasteFlash');

  // ── upload events ──
  uploadZone.addEventListener('click', e => {
    if (e.target === addMoreBtn || e.target.classList.contains('del')) return;
    if (photos.length < MAX) fileInput.click();
  });
  addMoreBtn.addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });
  fileInput.addEventListener('change', () => { Array.from(fileInput.files).forEach(addFile); fileInput.value=''; });

  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
  uploadZone.addEventListener('dragleave', e => { if (!uploadZone.contains(e.relatedTarget)) uploadZone.classList.remove('drag'); });
  uploadZone.addEventListener('drop', e => { e.preventDefault(); uploadZone.classList.remove('drag'); Array.from(e.dataTransfer.files).forEach(addFile); });

  document.addEventListener('paste', e => {
    const imgs = Array.from(e.clipboardData?.items ?? []).filter(i => i.type.startsWith('image/'));
    if (!imgs.length) return;
    e.preventDefault();
    imgs.forEach(i => { const f = i.getAsFile(); if (f) addFile(f); });
    flash();
  });

  function flash() {
    pasteFlash.classList.add('show');
    setTimeout(() => pasteFlash.classList.remove('show'), 1600);
  }

  function addFile(file) {
    if (!file.type.startsWith('image/') || photos.length >= MAX) return;
    const reader = new FileReader();
    reader.onload = e => {
      const dataUrl = e.target.result;
      photos.push({ base64: dataUrl.split(',')[1], mime: file.type, dataUrl });
      renderPhotos();
    };
    reader.readAsDataURL(file);
  }

  function removePhoto(idx) { photos.splice(idx, 1); renderPhotos(); }

  function renderPhotos() {
    const has = photos.length > 0;
    uploadPh.style.display = has ? 'none' : 'block';
    photoMeta.style.display = has ? 'flex' : 'none';
    photoCount.textContent = `${photos.length} / ${MAX}`;
    addMoreBtn.style.display = photos.length < MAX ? 'inline' : 'none';
    btnTasar.disabled = photos.length === 0;

    photoGrid.innerHTML = photos.map((p, i) => `
      <div class="photo-thumb">
        <img src="${p.dataUrl}" alt="" />
        <button class="del" data-i="${i}" type="button">x</button>
      </div>
    `).join('');
    photoGrid.querySelectorAll('.del').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); removePhoto(+b.dataset.i); }));
  }

  // ── loading steps ──
  let loadTimers = [];
  function startLoadingSteps() {
    ['step1','step2','step3'].forEach(id => {
      const el = document.getElementById(id);
      el.classList.remove('active','done');
    });
    document.getElementById('step1').classList.add('active');
    loadTimers.push(setTimeout(() => {
      document.getElementById('step1').classList.replace('active','done');
      document.getElementById('step2').classList.add('active');
    }, 2200));
    loadTimers.push(setTimeout(() => {
      document.getElementById('step2').classList.replace('active','done');
      document.getElementById('step3').classList.add('active');
    }, 5000));
  }
  function clearLoadTimers() { loadTimers.forEach(clearTimeout); loadTimers = []; }

  // ── tasar ──
  btnTasar.addEventListener('click', async () => {
    if (!photos.length) return;
    errorMsg.style.display = 'none';
    btnTasar.disabled = true;
    btnTasar.textContent = 'Tasando...';
    btnTasar.classList.add('loading');
    resultEmpty.style.display = 'none';
    resultContent.style.display = 'none';
    loadingState.style.display = 'flex';
    startLoadingSteps();

    const payload = {
      images: photos.map(p => ({ image_base64: p.base64, mime_type: p.mime })),
      contexto: document.getElementById('contexto').value.trim(),
      costo: document.getElementById('costo').value || null,
      pvp: document.getElementById('pvp').value || null,
    };

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      renderResult(data.result, data.mlu ?? []);
    } catch (err) {
      loadingState.style.display = 'none';
      resultEmpty.style.display = 'flex';
      errorMsg.textContent = err.message;
      errorMsg.style.display = 'block';
    } finally {
      clearLoadTimers();
      btnTasar.disabled = photos.length === 0;
      btnTasar.textContent = 'Tasar';
      btnTasar.classList.remove('loading');
    }
  });

  // ── parse result ──
  function extract(text, key, nextKey) {
    const re = new RegExp(`${esc(key)}\\s*:?\\s*`, 'i');
    const m = text.match(re);
    if (!m) return '';
    const start = m.index + m[0].length;
    if (!nextKey) return text.slice(start).trim();
    const re2 = new RegExp(`${esc(nextKey)}\\s*:?`, 'i');
    const m2 = text.slice(start).match(re2);
    return text.slice(start, m2 ? start + m2.index : undefined).trim();
  }
  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function getDecision(text) {
    if (/SOLO\s+SI\s+BAJA/i.test(text)) return 'SOLO SI BAJA';
    if (/\bCOMPRA\b/i.test(text)) return 'COMPRA';
    if (/\bPASO\b/i.test(text)) return 'PASO';
    return null;
  }

  function decisionClass(d) {
    if (d === 'COMPRA') return 'badge-compra';
    if (d === 'SOLO SI BAJA') return 'badge-baja';
    return 'badge-paso';
  }
  function histBadgeClass(d) {
    if (d === 'COMPRA') return 'hb-compra';
    if (d === 'SOLO SI BAJA') return 'hb-baja';
    return 'hb-paso';
  }

  function renderResult(text, mluData) {
    clearLoadTimers();
    loadingState.style.display = 'none';

    const decision = getDecision(text);
    const titulo   = extract(text, 'TÍTULO', 'DECISIÓN').replace(/\n.*/s,'').trim();
    const numBlock = extract(text, 'NÚMEROS', 'POR QUÉ');
    const porQue   = extract(text, 'POR QUÉ', 'OJO');
    const ojo      = extract(text, 'OJO', 'TIP').replace(/\n.*/s,'').trim();
    const tip      = extract(text, 'TIP', null).replace(/\n.*/s,'').trim();

    document.getElementById('resTitle').textContent = titulo || '';

    const badge = document.getElementById('resBadge');
    badge.textContent = decision || '?';
    badge.className = 'decision-badge ' + (decision ? decisionClass(decision) : '');

    const pvpLine    = (numBlock.match(/PVP\s*:\s*(.+)/i) || [])[1]?.trim() ?? '?';
    const margenLine = (numBlock.match(/Margen\s*:\s*(.+)/i) || [])[1]?.trim() ?? '?';
    const confLine   = (numBlock.match(/Confianza\s*:\s*(.+)/i) || [])[1]?.trim() ?? '?';
    document.getElementById('resNumbers').innerHTML = `
      <div class="num-card"><div class="num-label">PVP</div><div class="num-value">${esc2(pvpLine)}</div></div>
      <div class="num-card"><div class="num-label">Margen</div><div class="num-value highlight">${esc2(margenLine)}</div></div>
      <div class="num-card"><div class="num-label">Confianza</div><div class="num-value">${esc2(confLine)}</div></div>
    `;

    // MLU REAL
    const mluEl = document.getElementById('resMlu');
    const mluSearchesEl = document.getElementById('resMluSearches');
    const searches = Array.isArray(mluData) ? mluData : [];
    if (searches.length) {
      mluSearchesEl.innerHTML = searches.map(s => {
        if (s.error || s.total === 0) {
          return `<div class="mlu-search-card">
            <div class="mlu-search-query">Busqueda: <strong>${esc2(s.query)}</strong></div>
            <div class="mlu-no-results">${s.error ? 'Error al buscar' : 'Sin resultados en MLU'}</div>
          </div>`;
        }
        const { min, max, median } = s.stats ?? {};
        const statsHtml = min != null ? `
          <div class="mlu-stats">
            <div class="mlu-stat"><span class="sl">Publicaciones: </span><span class="sv">${s.total}</span></div>
            <div class="mlu-stat"><span class="sl">Min: </span><span class="sv">UYU ${min}</span></div>
            <div class="mlu-stat"><span class="sl">Max: </span><span class="sv">UYU ${max}</span></div>
            <div class="mlu-stat"><span class="sl">Mediana: </span><span class="sv med">UYU ${median}</span></div>
          </div>` : `<div class="mlu-stats"><div class="mlu-stat"><span class="sl">Publicaciones: </span><span class="sv">${s.total}</span></div></div>`;
        const itemsHtml = (s.items ?? []).map(i =>
          `<div class="mlu-item"><span class="mi-title">${esc2(i.titulo)}</span><span class="mi-price">UYU ${i.precio}</span></div>`
        ).join('');
        return `<div class="mlu-search-card">
          <div class="mlu-search-query">Busqueda: <strong>${esc2(s.query)}</strong></div>
          ${statsHtml}
          <div class="mlu-items">${itemsHtml}</div>
        </div>`;
      }).join('');
      mluEl.style.display = 'block';
    } else {
      mluEl.style.display = 'none';
    }

    const whyEl = document.getElementById('resWhy');
    const whyLines = document.getElementById('resWhyLines');
    if (porQue) {
      const lines = porQue.split('\n').map(l => l.trim()).filter(Boolean);
      whyLines.innerHTML = lines.map(line => {
        if (/^\+/.test(line)) return `<div class="why-line"><span class="sign sign-pos">+</span><span>${esc2(line.replace(/^\+\s*/,''))}</span></div>`;
        if (/^-/.test(line))  return `<div class="why-line"><span class="sign sign-neg">-</span><span>${esc2(line.replace(/^-\s*/,''))}</span></div>`;
        return `<div class="why-line"><span>${esc2(line)}</span></div>`;
      }).join('');
      whyEl.style.display = 'block';
    } else {
      whyEl.style.display = 'none';
    }

    document.getElementById('resOjoTip').innerHTML = `
      ${ojo ? `<div class="ojo-tip-card"><div class="card-label">Ojo librero</div><div class="card-text">${esc2(ojo)}</div></div>` : ''}
      ${tip ? `<div class="ojo-tip-card"><div class="card-label">Tip</div><div class="card-text">${esc2(tip)}</div></div>` : ''}
    `;

    resultContent.style.display = 'block';

    historial.unshift({ decision, titulo: titulo || text.slice(0,40), text, mluData: searches });
    renderHistBtn();

    if (window.innerWidth <= 680) {
      document.getElementById('panelResult').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function esc2(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  // ── historial ──
  function renderHistBtn() {
    histBtn.classList.toggle('visible', historial.length > 0);
    histBtn.textContent = `Historial (${historial.length})`;
  }

  histBtn.addEventListener('click', () => {
    histListScroll.innerHTML = historial.map((e, i) => `
      <div class="hist-entry" data-i="${i}">
        <span class="hist-badge-sm ${histBadgeClass(e.decision)}">${e.decision || '?'}</span>
        <span class="hist-entry-text">${esc2(e.titulo)}</span>
      </div>
    `).join('');
    histListScroll.querySelectorAll('.hist-entry').forEach(el => {
      el.addEventListener('click', () => {
        histDrawer.classList.remove('open');
        const e = historial[+el.dataset.i];
        renderResult(e.text, e.mluData);
      });
    });
    histDrawer.classList.add('open');
  });
  histClose.addEventListener('click', () => histDrawer.classList.remove('open'));
</script>

</body>
</html>
